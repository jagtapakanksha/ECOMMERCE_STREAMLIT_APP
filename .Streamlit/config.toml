[server]
enableStaticServing = true

# E-Commerce Intelligence theme (based on the Snowflake theme template)
[theme]
base = "light"
primaryColor = "#29B5E8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F9FC"
codeBackgroundColor = "#EEF6FA"
textColor = "#1B2B3A"
linkColor = "#1A8FC4"
borderColor = "#D6E6EF"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "Inter"
codeFont = "JetBrainsMono"
codeFontSize = "12px"
codeTextColor = "#11567F"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false
chartCategoricalColors = ["#29B5E8", "#6554C0", "#00A3BF", "#FF8B00", "#36B37E", "#DE350B", "#11567F", "#FFAB00"]

blueColor = "#29B5E8"
greenColor = "#36B37E"
yellowColor = "#FFAB00"
orangeColor = "#FF8B00"
redColor = "#DE350B"
violetColor = "#6554C0"

dataframeBorderColor = "#D6E6EF"
dataframeHeaderBackgroundColor = "#EAF4F9"

[theme.sidebar]
backgroundColor = "#11567F"
secondaryBackgroundColor = "#174D6A"
codeBackgroundColor = "#0E4D6B"
textColor = "#FFFFFF"
borderColor = "#1E6D94"
primaryColor = "#7FD3F2"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter-Medium.ttf"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter-SemiBold.ttf"
weight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter-Bold.ttf"
weight = 700

[[theme.fontFaces]]
family = "JetBrainsMono"
url = "app/static/JetBrainsMono-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "JetBrainsMono"
url = "app/static/JetBrainsMono-Medium.ttf"
weight = 500
